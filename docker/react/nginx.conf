server {
    listen 80;
    server_name localhost;

    # Bloqueio principal para servir o React (Vite SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Tenta carregar o arquivo, se não encontrar, redireciona para o index.html (necessário para o React Router funcionar)
        try_files $uri $uri/ /index.html;
    }

    # Redireciona chamadas de API para o container do Django
    # Ajuste o '/api/' caso suas rotas do Django tenham outro prefixo
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redireciona chamadas para o Admin do Django
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Configuração para servir arquivos estáticos do Django (CSS do admin, etc)
    # Lembre-se de rodar python manage.py collectstatic e configurar STATIC_ROOT
    location /static/ {
        proxy_pass http://backend:8000/static/;
    }

    # Configuração para arquivos de mídia do Django (uploads de usuários)
    location /media/ {
        proxy_pass http://backend:8000/media/;
    }
}